# Base configuration, shared by every profile (application-dev.yml /
# application-prod.yml). Only environment-agnostic values live here:
# connection endpoints, credentials and anything that differs dev/prod
# (RNF-16, alert thresholds, partition-driven concurrency, ...) is set per
# profile. See config/README.md for the environment variables prod expects.
#
# Only two environments exist: dev and prod (RNF-09).
spring:
  application:
    name: generic-service-adapter
  task:
    scheduling:
      # WP8 adds PartitionMaintenanceRunner, ConsumerLagMetrics and AlertEvaluator
      # to the existing ReportRunner + OrphanReprocessor @Scheduled methods. The
      # default single-thread scheduler would serialise them, so a slow tick (a
      # 15-min report assembly, a partition ALTER) could starve the ~10s
      # consumer-lag refresh and the alert evaluation. One thread per scheduled
      # concern plus a little headroom.
      pool:
        size: 6
  lifecycle:
    # RNF-10 / ADR 0018: cap on how long each SmartLifecycle shutdown phase may take
    # to drain. The Kafka listener containers (KafkaListenerEndpointRegistry, phase
    # Integer.MAX_VALUE-100) are stopped first, before the destination ProducerFactory
    # and the Hikari DataSource are destroyed as beans, so an in-flight message can
    # finish publish -> audit -> ack within this budget. devops sets the k8s
    # terminationGracePeriodSeconds strictly above this value.
    timeout-per-shutdown-phase: 30s
  datasource:
    hikari:
      data-source-properties:
        # mysql-connector-j defaults to JDBC-spec "matched rows" semantics for executeUpdate()
        # (every WHERE-matched row counts as affected, even with no actual column change).
        # JdbcAnagraphicRegistry's CAS upsert (outbound/persistence, WP2) needs the C-API
        # "affected rows" semantics instead: INSERT ... ON DUPLICATE KEY UPDATE then reports 0
        # affected rows when the CAS guard blocks the update (existing row set to its current
        # values), 1 on insert, 2 on a real update — the exact "did it apply" signal that method
        # returns with no separate SELECT. Environment-agnostic (both dev and prod URLs go through
        # this same Hikari connection-property, regardless of what GSA_DB_URL itself contains).
        useAffectedRows: true

server:
  # RNF-10: on SIGTERM, stop poll()ing and let in-flight messages complete
  # publish + audit + ack before the context closes (ADR 0018).
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Scrape endpoint for Prometheus + basic health/info (ADR 0017).
        # Management port is not meant to be public: devops restricts access.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Portfolio project: the management port is not public (devops restricts it),
      # so full health detail is shown. A real prod deployment with management-port
      # auth would switch this to `when-authorized`.
      show-details: always
      show-components: always
      # Re-enabled in WP8: every id referenced by the two groups below has a real
      # contributor — `db` (Boot DataSource), `flyway` + `kafka` (WP8 custom,
      # config/observability/health), `destinationKafka` / `schemaRegistry` /
      # `vault` (WP8 custom, same package). Boot validates group membership
      # eagerly at startup, so the context fails fast on a typo here.
      validate-group-membership: true
      group:
        # ADR 0018: readiness = DB reachable AND source Kafka reachable AND
        # Flyway migrations applied. `db` is Boot's DataSource indicator;
        # `flyway` and `kafka` (source cluster only) are WP8 custom indicators
        # in config/observability/health — Spring Boot 4.1 ships neither.
        readiness:
          include: readinessState,db,flyway,kafka
        # ADR 0018: destination cluster / Schema Registry / Vault reachability
        # feeds the alerts, but must NOT flip readiness (avoids flapping while
        # back-pressure is already handling the outage). Custom indicators in
        # config/observability/health, WP8.
        downstream:
          include: destinationKafka,schemaRegistry,vault
  metrics:
    distribution:
      # RNF-02: expose p95 (and p99) of gsa_publish_latency_seconds. The
      # histogram buckets let a Prometheus server aggregate percentiles across
      # replicas; the client-side quantiles are a convenience for single-replica
      # dashboards. Key is the raw meter name (underscores), matched as a prefix.
      percentiles-histogram:
        gsa_publish_latency_seconds: true
      percentiles:
        gsa_publish_latency_seconds: 0.95, 0.99

# ---------------------------------------------------------------------------
# gsa.* — application @ConfigurationProperties (config/properties/*).
# Values below are the ones identical across dev/prod (topic names, group
# names, retry/orphan-hold/report timing policy, DB retention). Anything that
# differs per environment (endpoints, credentials, concurrency, security
# protocol, alert thresholds) is set in application-dev.yml / application-prod.yml.
# No hardcoded value in the Java code (RF-15, RNF-09): everything is a key here.
# ---------------------------------------------------------------------------
gsa:
  kafka:
    source:
      # earliest: a first deploy of a new consumer group must not skip source
      # messages produced before it joined (RNF-03). Same in dev and prod.
      auto-offset-reset: earliest
      groups:
        anagrafica: gsa-anagrafica
        movimenti: gsa-movimenti
        retry: gsa-retry
      topics:
        user-account-data: user-account-data
        wallet-account-topup: wallet-account-topup
        wallet-account-withdrawal: wallet-account-withdrawal
    destination:
      acks: all
      enable-idempotence: true
      max-in-flight-requests-per-connection: 5
      topics:
        user-account: UserAccount
        wallet-movement: WalletMovement

  datasource:
    report-runner-lock-name: gsa_report_runner
    # Technical retention (AD-retention-audit-window), not a business
    # requirement (modello-dati.md); configurable per environment.
    audit-retention-days: 30
    case-record-retention-days: 30
    orphan-movement-retention-days: 7
    report-file-metadata-retention-days: 30

  # Daily-partition maintenance for `audit` + `case_record` (modello-dati.md
  # §Partitioning and retention). Single-instance @Scheduled job: dedicated
  # GET_LOCK name (NOT report-runner-lock-name — the two jobs must not serialise
  # on each other), pre-creates future daily partitions, drops the ones fully
  # past the retention window above, Batch-15 pre-check on `case_record`.
  partition-maintenance:
    enabled: true
    lock-name: gsa_partition_maintenance
    interval: 6h
    future-partitions-ahead-days: 7

  # Timeouts for the WP8 custom Actuator health indicators (ADR 0018). Every one
  # is a short reachability probe, never a client-default blocking call.
  health:
    source-kafka-timeout: 2s
    downstream:
      destination-kafka-timeout: 2s
      schema-registry-timeout: 2s
      vault-timeout: 2s

  # Polling cadence of the two observability components (ADR 0017).
  observability:
    consumer-lag-refresh-interval: 10s
    alert-evaluation-interval: 30s

  orphan-hold:
    hold-timeout: 60s
    reprocessor-interval: 15s
    reprocessor-batch-size: 200

  report:
    schedule-interval: 15m
    pending-report-threshold: 500
    threshold-polling-interval: 30s
    xml-file-retention: 7d
    max-raw-payload-bytes: 65536
    assembly-batch-size: 500
    send-batch-size: 100
    # Placeholder default: application-dev.yml / application-prod.yml set the real
    # environment tag written into the report <header>. Overridable via GSA_REPORT_ENVIRONMENT.
    environment: ${GSA_REPORT_ENVIRONMENT:local}

  # Manual retry routing for E7 / E3 (ADR 0002 rewrite — no @RetryableTopic). levels == max-attempts
  # in every profile: *.retry.0 .. *.retry.<levels-1>, exhaustion case_record after the last.
  # backoff*, retention and topic-pattern are environment-agnostic; concurrency and auto-create
  # differ per environment (application-dev.yml / application-prod.yml), like source.concurrency.
  retry:
    levels: 4
    max-attempts: 4
    backoff-initial: 1s
    backoff-max: 30s
    backoff-multiplier: 2.0
    # doc/devops only — the app never creates production topics. Must exceed holdTimeout and the
    # worst-case E7 retry span (max-attempts * backoff-max).
    retention: 1h
    # anchored to the three known source topics so no unrelated *.retry.* is ever consumed.
    topic-pattern: "(user-account-data|wallet-account-topup|wallet-account-withdrawal)\\.retry\\.\\d+"

  # E6 recovery probe (ADR 0007). Environment-agnostic resilience knob.
  back-pressure:
    probe:
      initial-backoff: 1s
      max-backoff: 30s
      multiplier: 2.0
      admin-timeout: 5s

  mapping:
    # Constants written to <message>.source (contratti.md §2). Not hardcoded in
    # the mappers (RF-07); environment-agnostic. One explicit key per source
    # topic so each matches contratti.md verbatim.
    user-account-source: generic-service-adapter/user-account-data
    wallet-topup-source: generic-service-adapter/wallet-account-topup
    wallet-withdrawal-source: generic-service-adapter/wallet-account-withdrawal
